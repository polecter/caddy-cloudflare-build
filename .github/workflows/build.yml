name: Build Caddy Cloudflare

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write
  packages: write

jobs:
  check-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current upstream Caddy digest
        id: digest
        run: |
          docker buildx imagetools inspect caddy:latest > /tmp/caddy.txt
          DIGEST=$(grep -m1 "Digest:" /tmp/caddy.txt | awk '{print $2}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Current digest: $DIGEST"

      - name: Check if digest changed
        id: check
        run: |
          OLD_DIGEST=""
          if [ -f .caddy-base-digest ]; then
            OLD_DIGEST=$(cat .caddy-base-digest)
          fi

          NEW_DIGEST="${{ steps.digest.outputs.digest }}"

          echo "Old digest: $OLD_DIGEST"
          echo "New digest: $NEW_DIGEST"

          if [ "$OLD_DIGEST" = "$NEW_DIGEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if no upstream change
        if: steps.check.outputs.changed == 'false'
        run: echo "Caddy upstream image unchanged. No build needed."

      - name: Get Caddy version
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          VERSION=$(docker run --rm caddy:latest caddy version | awk '{print $1}' | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Caddy version: $VERSION"

      - name: Login to GHCR
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/polecter/caddy-cloudflare:latest
            ghcr.io/polecter/caddy-cloudflare:${{ steps.version.outputs.version }}

      - name: Save new digest
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.digest.outputs.digest }}" > .caddy-base-digest
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .caddy-base-digest
          git commit -m "Update Caddy base digest to ${{ steps.version.outputs.version }}" || exit 0
          git push

      - name: Create GitHub Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: caddy-${{ steps.version.outputs.version }}
          name: Caddy ${{ steps.version.outputs.version }}
          body: |
            Custom Caddy image with Cloudflare DNS module.

            Upstream Caddy digest:
            `${{ steps.digest.outputs.digest }}`

            Images:
            - `ghcr.io/polecter/caddy-cloudflare:${{ steps.version.outputs.version }}`
            - `ghcr.io/polecter/caddy-cloudflare:latest`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
